<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | Weoryx Connect</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .login-input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
            font-family: inherit;
        }

        .login-input:focus {
            border-color: #8B5CF6;
        }

        .login-input::placeholder {
            color: rgba(255, 255, 255, 0.20);
        }
    </style>
</head>

<body
    class="bg-[#0D0D12] text-white font-['Cairo'] overflow-x-hidden min-h-screen flex flex-col items-center justify-center p-5">

    <div style="width: 100%; max-width: 384px;">
        <div class="reveal">
            <!-- Logo -->
            <div style="text-align: center; margin-bottom: 32px;">
                <a href="index.html"
                    style="display: block; position: relative; width: 56px; height: 56px; margin: 0 auto 16px; text-decoration: none;">
                    <div
                        style="position: absolute; inset: 0; border-radius: 16px; background: linear-gradient(135deg, #8B5CF6, #F59E0B);">
                    </div>
                    <div
                        style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 900; font-size: 20px;">
                        W</div>
                </a>
                <h1 style="font-size: 1.5rem; font-weight: 900; color: #fff; margin: 0;">تسجيل الدخول</h1>
                <p style="color: rgba(255,255,255,0.40); font-size: 14px; margin-top: 6px;">ادخل إلى لوحة التحكم الخاصة
                    بك</p>
            </div>

            <!-- Box -->
            <div class="glass noise" style="padding: 32px; border-radius: 20px;">
                <form id="login-form" style="display: flex; flex-direction: column; gap: 20px;">
                    <div>
                        <label
                            style="display: block; font-size: 14px; color: rgba(255,255,255,0.60); margin-bottom: 8px; font-weight: 500;">البريد
                            الإلكتروني</label>
                        <input type="email" id="email" placeholder="you@example.com" required dir="ltr"
                            class="login-input">
                    </div>

                    <div>
                        <div
                            style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
                            <a href="#" style="font-size: 12px; color: #a78bfa; text-decoration: none;">نسيت كلمة
                                المرور؟</a>
                            <label style="font-size: 14px; color: rgba(255,255,255,0.60); font-weight: 500;">كلمة
                                المرور</label>
                        </div>
                        <div style="position: relative;">
                            <input type="password" id="password" placeholder="••••••••" required class="login-input"
                                style="padding-left: 40px;">
                            <button type="button" id="toggle-pw" tabindex="-1"
                                style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: rgba(255,255,255,0.30); transition: color 0.2s; padding: 4px;"
                                onmouseenter="this.style.color='rgba(255,255,255,0.70)'"
                                onmouseleave="this.style.color='rgba(255,255,255,0.30)'">
                                <i data-lucide="eye" id="eye-icon" style="width: 17px; height: 17px;"></i>
                                <i data-lucide="eye-off" id="eye-off-icon"
                                    style="width: 17px; height: 17px; display: none;"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="submit-btn" class="btn-primary"
                        style="position: relative; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 16px; font-size: 16px; border: none; cursor: pointer; border-radius: 12px; margin-top: 4px; transition: opacity 0.2s;">
                        <span id="btn-content-normal" style="display: flex; align-items: center; gap: 8px;">
                            <i data-lucide="zap" style="width: 18px; height: 18px; position: relative; z-index: 1;"></i>
                            <span style="position: relative; z-index: 1;">تسجيل الدخول</span>
                        </span>
                        <span id="btn-content-loading" style="display: none; align-items: center; gap: 8px;">
                            <div
                                style="width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; position: relative; z-index: 1;">
                            </div>
                            <span style="position: relative; z-index: 1;">جارٍ الدخول...</span>
                        </span>
                    </button>
                </form>

                <p style="text-align: center; color: rgba(255,255,255,0.35); font-size: 14px; margin-top: 20px;">
                    ليس لديك حساب؟ <a href="register.html?plan=team"
                        style="color: #a78bfa; text-decoration: none; font-weight: 500;">سجّل مجانًا</a>
                </p>
            </div>
        </div>

        <!-- Channel badges -->
        <div class="reveal delay-200">
            <div style="display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 28px;">
                <span style="color: rgba(255,255,255,0.20); font-size: 12px;">يدعم</span>

                <div
                    style="width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #25D366; background: rgba(37,211,102,0.1);">
                    <i data-lucide="message-circle" style="width: 15px; height: 15px;"></i>
                </div>

                <div
                    style="width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #1877F2; background: rgba(24,119,242,0.1);">
                    <i data-lucide="facebook" style="width: 15px; height: 15px;"></i>
                </div>

                <div
                    style="width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #0088CC; background: rgba(0,136,204,0.1);">
                    <i data-lucide="send" style="width: 15px; height: 15px;"></i>
                </div>

                <div
                    style="width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #f472b6; background: rgba(244,114,182,0.1);">
                    <i data-lucide="instagram" style="width: 15px; height: 15px;"></i>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Password Toggle
            const togglePwBtn = document.getElementById('toggle-pw');
            const pwInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            const eyeOffIcon = document.getElementById('eye-off-icon');

            togglePwBtn.addEventListener('click', () => {
                const type = pwInput.getAttribute('type') === 'password' ? 'text' : 'password';
                pwInput.setAttribute('type', type);
                if (type === 'text') {
                    eyeIcon.style.display = 'none';
                    eyeOffIcon.style.display = 'block';
                } else {
                    eyeIcon.style.display = 'block';
                    eyeOffIcon.style.display = 'none';
                }
            });

            // Form Submission Simulation
            const loginForm = document.getElementById('login-form');
            const submitBtn = document.getElementById('submit-btn');
            const btnNormal = document.getElementById('btn-content-normal');
            const btnLoading = document.getElementById('btn-content-loading');

            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                submitBtn.disabled = true;
                submitBtn.style.opacity = '0.6';
                submitBtn.style.cursor = 'not-allowed';
                btnNormal.style.display = 'none';
                btnLoading.style.display = 'flex';

                // Simulate loading then redirect
                setTimeout(() => {
                    window.location.href = 'https://app.weoryx.com/dashboard';
                }, 1500);
            });
        });
    </script>
</body>

</html>
